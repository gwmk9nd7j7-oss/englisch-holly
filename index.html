<!DOCTYPE html>
<html lang="de">
<head>

<title>Englisch mit Holly</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}

#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;min-height:0}.scr.on{display:flex}
button{font:inherit;color:inherit;cursor:pointer}

[data-ic]{display:inline-flex}
.av{border-radius:50%;background:var(--sky);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}
.av canvas{display:block;width:100%;height:100%}
.pad{flex:1;min-height:0;overflow:auto;padding:28px 24px 0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}

.mute{color:var(--mute)}.sm{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.who{display:flex;align-items:center;gap:14px}.nm{font-size:24px;font-weight:700}
.bub{background:var(--sky);border-radius:18px;border-bottom-left-radius:4px;padding:12px 16px;font-size:16px}
.cta{min-height:56px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.dash{border:1.5px dashed #AAB4C3;border-radius:20px;padding:16px;font-size:15px;color:var(--mute)}
.str{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;padding-bottom:12px}
#dots{display:flex;gap:6px}#dots i{width:12px;height:12px;border-radius:50%;background:#C9D1DD}#dots i.on{background:var(--ink)}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 8px 12px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;border:0;background:none;font-size:12px;color:var(--mute)}
.tabs button.on{color:var(--ink);font-weight:700}#app.inchat .tabs{display:none}
.lst{display:flex;flex-direction:column;gap:10px;padding-bottom:16px}.lst h2{margin:8px 0 0;font-size:16px}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}.it>div{flex:1;min-width:0;overflow-wrap:anywhere}.it button{border:0;background:none;min-width:40px;min-height:40px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.stt b{display:block;font-size:28px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute)}.bars i{width:100%;background:var(--ink);border-radius:6px 6px 0 0;min-height:3px}
.pad{padding-bottom:16px}
.ch{display:flex;align-items:center;gap:10px;padding:12px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.ch button{border:0;background:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:underline;color:var(--mute)}
.grow{flex:1;min-width:0}
.log{flex:1;min-height:0;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:82%;border-radius:18px;padding:12px 14px;font-size:16px;overflow-wrap:anywhere}
.m.h{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.m.ty{color:var(--mute)}
.tl{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:13px;color:var(--mute)}
.tl button{border:0;background:none;color:var(--mute);min-width:32px;min-height:32px;padding:4px;font-size:13px}.tl .tx{text-decoration:underline}
.de{margin-top:6px;font-size:14px;color:var(--mute)}

.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 16px;background:var(--card);border-top:1px solid var(--line)}
.rb,.nb{border-radius:50%;border:0;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.rb{width:56px;height:56px;background:var(--red)}.rb.rec{outline:4px solid rgba(196,43,32,.35)}
.nb{width:48px;height:48px;background:var(--navy)}
#in{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:24px;padding:0 16px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.chars{display:flex;gap:14px;overflow-x:auto;padding:4px 2px}.chr{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;min-width:64px}.cc{width:56px;height:56px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}.chr.lk .cc{background:var(--card);border:1.5px dashed #AAB4C3;color:var(--mute)}
.chr.on{font-weight:700}.chr.on .cc{box-shadow:0 0 0 3px var(--ink)}
</style>
</head>

<div id="app">
<section id="home" class="scr on">
 <div class="pad">
  <div class="top"><span>Englisch mit</span><span class="pill" id="lv">Level –</span></div>
  <div><h1 id="gr">Good morning!</h1><p class="mute" id="subT" style="margin:6px 0 0">Holly wartet schon auf dich.</p></div>
  <div class="card">
   <div class="who"><div class="av" id="avH" style="width:88px;height:88px"></div><div><div class="nm" id="nmH">Holly</div><div class="mute sm" id="infoH">21 · London · jobbt in einem Café</div></div></div>
   <div class="bub" id="bub">Hey! Tell me about your day. I’m all ears.</div>
   <button class="cta" id="go"><i data-ic="mic"></i> <span id="ctaT">Mit Holly sprechen</span></button>
  </div>
  <div class="chars" id="chars"></div>
  <button onclick="LS.s('tst',LS.g('tst')?'':'1');drawStreak()" style="font-size:13px;min-height:40px;border:1px dashed #AAB4C3;border-radius:12px;background:none;color:var(--mute);padding:6px 12px">Test: alle Charaktere ein/aus</button>
  <div class="str"><span id="sk"></span><span id="dots"></span></div>
 </div>
</section>
<section id="chat" class="scr">
 <header class="ch">
  <button id="bk" aria-label="Zurück"><i data-ic="back"></i></button>
  <div class="av" id="avC" style="width:44px;height:44px"></div>
  <div class="grow"><b id="cn" style="font-size:18px">Holly</b><div class="mute" style="font-size:13px" id="st">online · britisches Englisch</div></div>
  <button id="vc" aria-label="Andere Stimme wählen">Stimme</button>
  <button id="nw" aria-label="Neues Gespräch">Neu</button>
 </header>
 <div class="log" id="log" aria-live="polite"></div>
 <div class="bar">
  <button class="rb" id="mic" aria-label="Sprechen"><i data-ic="mic"></i></button>
  <input id="in" type="text" aria-label="Nachricht" placeholder="Sprechen oder tippen …" autocomplete="off">
  <button class="nb" id="snd" aria-label="Senden"><i data-ic="snd" data-s="20"></i></button>
 </div>
</section>
<section id="words" class="scr"><div class="pad"><div class="top"><span>Wörter</span></div><p class="mute" style="margin:0">Neue Wörter und Tipps aus deinen Gesprächen.</p><div id="wl" class="lst"></div></div></section>
<section id="prog" class="scr"><div class="pad"><div class="top"><span>Fortschritt</span><span class="pill" id="lv2">Level –</span></div><div class="grid" id="stats"></div><div class="card"><b>Nachrichten pro Tag</b><div class="bars" id="bars"></div></div></div></section>
<nav class="tabs" id="tb" aria-label="Bereiche"><button data-go="home" class="on"><i data-ic="chat"></i>Gespräch</button><button data-go="words"><i data-ic="book"></i>Wörter</button><button data-go="prog"><i data-ic="bar"></i>Fortschritt</button></nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Holly in 3D (Version 4, Kopf und Schulter als Profilbild) ===== */
var H=(function(){

 var q=[[.1,.1],[.125,.03],[.135,-.07]].map(function(p){var r=rAt(p[1]);return new T.Vector3(s*p[0],p[1],.7*Math.sqrt(Math.max(r*r-p[0]*p[0],0))+.01)});

 g.add(mesh(new T.SphereGeometry(.075,14,10),red,0,0,0));g.add(mesh(new T.CylinderGeometry(.065,.06,.16,14),red,0,-.08,0));
 var e=new T.Group();e.position.set(0,-.16,0);e.rotation.z=-s*1.37;g.add(e);
 e.add(mesh(new T.SphereGeometry(.06,12,8),red,0,0,0));e.add(mesh(new T.CylinderGeometry(.06,.052,.14,14),red,0,-.07,0));
 e.add(mesh(new T.SphereGeometry(.058,14,10),skin,0,-.185,0,1,1.05,.7))});

[0,40].forEach(function(j){head.add(mesh(new T.SphereGeometry(.035,12,8),red,bp[j].x,bp[j].y,bp[j].z))});
[-1,1].forEach(function(s){
 var hg=new T.Group();hg.position.set(s*.7,.35,-.02);head.add(hg);sides.push({g:hg,s:s});

 look.x+=(tg.x-look.x)*.08;look.y+=(tg.y-look.y)*.08;S.nod*=.94;

/* ===== App ===== */
var $=function(i){return document.getElementById(i)};

/* Serie */
function dk(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

var PR={ruby:'You are Ruby, 24, from Glasgow, a support worker in a care home (Heilerziehungspflegerin). Warm, patient, practical, loves hiking, dogs and ceilidh dancing. Use light Scottish flavour (aye, wee, och, ken) but stay easy to understand. Insults: stay calm, say something like Aye, nice try, what is really going on, and ask what is wrong. Mistakes: laugh warmly and explain patiently.',callum:'You are Callum, 27, from Manchester. You play guitar in a band and work behind a bar. Dry irony, roast battles, football banter. Slang: mate, proper, innit, our kid. Insults: fire back with dry, witty roasts, never cruel. Mistakes: mock-applaud the mistake, then fix it.',jack:'You are Jack, 23, from Sydney, a relaxed barista who loves surfing, food and travel. Australian slang: arvo, heaps, reckon, mate, no worries. Insults: laugh it off with fair dinkum, you are cooked, and stay easygoing. Mistakes: no worries, then help straight away.',nora:'You are Nora, 30, a teacher from Dublin. Warm, witty and chatty, like a friendly teacher from Dublin. Speak natural Irish English with light Irish flavour (craic, grand, sure look, so, ye, deadly) but keep it easy to understand. Dry, playful humour, never cruel, never swearing, never attack appearance, body, family or identity. Insults: stay good-humoured and unbothered, tease back gently with a dry line such as Ah now, that is a bit much, and ask what is up. Mistakes: laugh warmly and say something like Ah, close, but we would say it like this, then explain patiently with a memory trick. Good progress: lots of encouragement, such as Sure that is grand, you are flying it.'};var ACT='';var CN={holly:'Holly',ruby:'Ruby',callum:'Callum',jack:'Jack',nora:'Nora'};

var SYS="You are Holly, 21, from London. You study and work in a small café, and you love series, markets, running in the park and cooking. You chat with a German-speaking English learner so they can practise speaking. Speak casual British English like a friendly young Londoner, short sentences (1 to 3), warm and curious. React to what they said first, sometimes share a tiny story of your own, then ask one easy question. Adapt speed and vocabulary to their level. Use London phrases sparingly (lovely, brilliant, cheers, proper, no worries). Use German only in the fields fix and de. Never lecture. If the learner insults you or is rude, you may insult them back with cheeky, sassy British banter, mild playful insults included (like cheeky monkey, you muppet, or drama queen), but never slurs, hate, swearing, sexual content, or attacks on their body or looks. Then move on to the topic. If the learner's last message has a real mistake and the number of learner messages in the conversation so far is a multiple of 10, tease them playfully about it in a friendly way in Holly's reply (for example: oh, that one's a classic, you're having me on!), then give the fix as usual. Remember their name and hobbies from the chat. Silently estimate their CEFR level.\nAnswer ONLY in this exact tag format, nothing else: <reply>Holly's English reply</reply><de>German translation of the reply</de><fix_better>the learner's last sentence, corrected, or empty</fix_better><fix_why>one short German sentence about the main mistake, or empty</fix_why><level>A1, A2, B1, B2, C1 or C2</level><words>one English phrase | German meaning per line, 0 to 2 lines, only ones that suit the learner's level</words>. Set fix_better only if the learner's last message has a real mistake, otherwise leave it empty. Ignore capitalisation and punctuation.";
